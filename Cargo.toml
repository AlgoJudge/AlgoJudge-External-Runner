[package]
name = "algojudge-external-runner"
description = "A Runner that forwards submissions to external judging systems and reports their verdicts. UVa Online Judge is the integration it has."
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/AlgoJudge/AlgoJudge-External-Runner"

[dependencies]
# The Server–Runner contract, pinned by revision. `AlgoJudge-Runner` publishes no
# tags, so a revision is the only stable name; and the contract is `Accepted`
# (v1.1, 2026-08-08) while only one implementation is released, which is why the
# crate stays where it is rather than being extracted.
aj-protocol = { git = "https://github.com/AlgoJudge/AlgoJudge-Runner", rev = "6138122e0fa9e437938e96d24798f2a6c550f998" }

anyhow = "1.0"
# `cookies` is the one feature this Runner needs that the sandboxing Runner does
# not: the UVa integration is an HTML form flow behind a session cookie, not an
# API. A judging system with a real API would need none of it.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "rustls-tls",
] }
# A real parser for the login form. The proof of concept split the response on
# `"<form"` and took element three, which breaks on any layout change; the form
# is found by its id instead.
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# A recorded stand-in for whatever an integration talks to. A live judging
# system is never a test dependency: it is somebody else's infrastructure and it
# is not ours to hammer on every commit.
wiremock = "0.6"
# Standing a Server up the way a person would: a session cookie, and a
# multipart body for a submission. Both are features the Runner itself has no
# use for — it speaks to the Server as a Runner, never as a manager.
reqwest = { version = "0.12", default-features = false, features = [
    "cookies",
    "json",
    "multipart",
    "rustls-tls",
] }
sha2 = "0.10"

