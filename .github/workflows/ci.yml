name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The same compiler `./x` uses, pinned by digest rather than by tag so that
    # CI and a developer's machine cannot drift onto two versions without either
    # of them being told. Copied from `AlgoJudge-Runner`, deliberately: two
    # Runners compiled against two compilers is a difference nobody would look
    # for when one of them misbehaves.
    container:
      image: rust@sha256:3b2879047d42784ca9403ad20c51ed3df361a50f1df96f5777d39b4e33aa65cd

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # `rust:slim` installs the minimal profile, which has neither.
      - name: Add the components the gate needs
        run: rustup component add rustfmt clippy

      # `aj-protocol` is a git dependency pinned to a revision, and the
      # repository holding it is public — so this needs no credential, and must
      # not be given one.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      # Everything here runs offline. The tests against an integration's judging
      # system — `onlinejudge.org` and uHunt, for the one that exists — drive a
      # recorded stand-in started in-process; a live judge is never a test
      # dependency, which is the whole reason this job needs no services and no
      # secrets.
      - name: Test
        run: cargo test --workspace

  # **A Dockerfile nothing builds is a Dockerfile that breaks quietly.** The one
  # here is how this Runner is actually shipped, and it has its own failure modes
  # the gate above cannot see: a musl target that stops resolving, a base digest
  # that goes away, a stub-crate trick that silently produces an empty binary.
  #
  # The image alone, not the stack. Standing a Server up beside it would make CI
  # able to run the integration tests that are `#[ignore]`d today — worth doing,
  # and a decision of its own rather than a side effect of adding an image.
  image:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Built and not pushed. Where this is published is `AlgoJudge-Ops`'s
      # question; that repository exists since 2026-08-30 and does not carry
      # this image yet.
      - name: Build
        run: docker build -t algojudge-external-runner:ci .

      # **The directory the source cache lives in, and who owns it.**
      #
      # It was absent from the image from the first build until 2026-08-31, and
      # nothing in this gate could see it. The step below proves only that the
      # binary refuses to start unconfigured, which it does before touching any
      # directory; the cache is not written until a job has been claimed, so a
      # missing one failed later and looked like something else — every claimed
      # job reported as an infrastructure failure, with the archive never
      # contacted.
      #
      # Read off the exported filesystem rather than by running anything:
      # `distroless/static` has no shell to ask, which is the whole point of it.
      - name: The cache directory is in the image and belongs to the Runner
        run: |
          docker create --name probe algojudge-external-runner:ci >/dev/null
          owner=$(docker export probe | tar -tvf - \
            | awk '$NF == "var/cache/algojudge-external-runner/" { print $2 }')
          docker rm probe >/dev/null
          test -n "$owner" || { echo "the cache directory is not in the image" >&2; exit 1; }
          test "$owner" = "65532/65532" \
            || { echo "the cache directory belongs to $owner, not to nonroot" >&2; exit 1; }
          echo "owned by $owner"

      # It should refuse, by name, and that is the whole assertion: an image that
      # started with no configuration would be an image that had defaulted the
      # address of the Server it talks to.
      - name: It refuses to start with nothing configured
        run: |
          set +e
          output=$(docker run --rm algojudge-external-runner:ci 2>&1)
          code=$?
          set -e
          test "$code" != "0" || { echo "started with no configuration" >&2; exit 1; }
          echo "$output" | grep -q 'AJ_Server__BaseUrl is required'             || { echo "refused, but not by name:" >&2; echo "$output" >&2; exit 1; }
